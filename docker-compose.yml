version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: taskpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskpilot
      POSTGRES_PASSWORD: taskpilot_secret_password
      POSTGRES_DB: taskpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskpilot -d taskpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
